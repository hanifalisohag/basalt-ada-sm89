[pytest]
# The Python tests are the tool tests, as CI runs them (see .github/workflows/ci.yml). tests/ holds script-style
# checks that take a built binary as argv[1] and are run by the C++/CUDA harness, not collected here; without this
# scope a bare `pytest` tries to import them and errors. serve/tests is CI's own step (`pytest serve/tests -n auto`)
# and is not collected here: it needs a running server and has failures on this machine that predate this branch.
testpaths = tools
python_files = test_*.py
addopts = -n auto

[pytest]
# The Python tests are the server suite and the tool tests, as CI runs them (see .github/workflows/ci.yml).
# tests/ holds script-style checks that take a built binary as argv[1] and are run by the C++/CUDA harness, not
# collected here; without this scope a bare `pytest` tries to import them and errors.
testpaths = serve/tests tools
python_files = test_*.py
